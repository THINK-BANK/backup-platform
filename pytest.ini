[pytest]
testpaths = tests
# 只收集 test_*.py：tests/ 下的独立脚本（如 playwright_save_test.py、
# e2e_v1411_fixes.py）是手动执行的运维/回归脚本，不参与自动收集。
python_files = test_*.py
addopts = -p no:cacheprovider --strict-markers
markers =
    gate: 纳入提交前/CI 门禁的确定性用例（无外网、无真实数据库依赖）
    integration: 需要真实数据库/SSH 目标环境的用例（默认不进 CI 门禁）
    slow: 耗时用例（压测、全量回归）
filterwarnings =
    ignore::DeprecationWarning
